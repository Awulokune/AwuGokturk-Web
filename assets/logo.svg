<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AwuGöktürk logosu">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a2a"/>
      <stop offset="0.55" stop-color="#07121f"/>
      <stop offset="1" stop-color="#040a12"/>
    </linearGradient>
    <linearGradient id="mark" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#99f6e4"/>
      <stop offset="0.48" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.44" r="0.6">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.28"/>
      <stop offset="0.65" stop-color="#0ea5e9" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="105" fill="none" stroke="#5eead4" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="256" cy="248" r="176" fill="url(#halo)"/>

  <!-- devre izleri -->
  <g fill="none" stroke="#5eead4" stroke-opacity="0.24" stroke-width="3" stroke-linecap="round">
    <path d="M92 190h38l22-22"/>
    <path d="M420 190h-38l-22-22"/>
    <path d="M92 330h30l20 20"/>
    <path d="M420 330h-30l-20 20"/>
  </g>
  <g fill="#5eead4" fill-opacity="0.55">
    <circle cx="92" cy="190" r="5"/>
    <circle cx="420" cy="190" r="5"/>
    <circle cx="92" cy="330" r="5"/>
    <circle cx="420" cy="330" r="5"/>
  </g>

  <!-- A / devre damgası -->
  <g fill="none" stroke="url(#mark)" stroke-width="27" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <path d="M258 136L154 372"/>
    <path d="M258 136l104 236"/>
    <path d="M199 294h118"/>
  </g>
  <g fill="#07121f" stroke="url(#mark)" stroke-width="11">
    <circle cx="258" cy="136" r="20"/>
    <circle cx="154" cy="372" r="18"/>
    <circle cx="362" cy="372" r="18"/>
    <circle cx="199" cy="294" r="12"/>
    <circle cx="317" cy="294" r="12"/>
  </g>
  <g fill="#c7fff5" filter="url(#glow)">
    <circle cx="258" cy="136" r="6"/>
    <circle cx="154" cy="372" r="5"/>
    <circle cx="362" cy="372" r="5"/>
  </g>

  <!-- alt rune çizgileri -->
  <g stroke="#38bdf8" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round">
    <path d="M214 418h84"/>
    <path d="M232 434h48"/>
  </g>
</svg>
