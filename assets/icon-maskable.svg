  </g>
  <g fill="none" stroke="url(#mark)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M258 158L170 356"/>
    <path d="M258 158l88 198"/>
    <path d="M197 292h122"/>
  </g>
  <g fill="#07121f" stroke="url(#mark)" stroke-width="9">
    <circle cx="258" cy="158" r="17"/>
    <circle cx="170" cy="356" r="15"/>
    <circle cx="346" cy="356" r="15"/>
    <circle cx="197" cy="292" r="10"/>
    <circle cx="319" cy="292" r="10"/>
  </g>
  <g fill="#c7fff5" filter="url(#glow)">
